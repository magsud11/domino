<style>
:root{--wood:#3b2a1e;--ivory:#f3ecda;--ink:#1b1b1b;--brass:#c9a24b;--txt:#f3ecda}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--wood);color:var(--txt);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#2a1d14}
header h1{font-size:19px;margin:0;flex:1}
button,select,input{font:inherit;background:var(--brass);color:#2a1d14;border:0;border-radius:8px;padding:8px 12px;font-weight:bold}
button:disabled{opacity:.4}
input[type=range]{flex:1;padding:0;background:none}
#flag{background:#f3ecda}
main{flex:1;display:flex;flex-direction:column;min-height:0;background:repeating-linear-gradient(90deg,#0000 0 7px,#0001 7px 8px),radial-gradient(ellipse at center,#9a6a42,#5e3d24 80%);box-shadow:inset 0 0 0 6px #3a2515,inset 0 0 40px #000a}
.bar{display:flex;justify-content:space-between;padding:8px 14px;font-size:15px;background:#0005}
.bar b{color:var(--brass)}
#tbar{height:5px;background:#0006}
#tfill{display:block;height:100%;width:0;background:var(--brass);transition:width .25s linear}
#tfill.warn{background:#d9534f}
#seatT,#seatB{display:flex;align-items:center;gap:8px;padding:4px 12px}
#opp{display:flex;flex-direction:column;align-items:center}
#oppSt{font-size:12px;min-height:14px}
#oppSt.off{animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
#oppAv svg,#meAv svg{width:84px;height:67px;display:block}
.flip svg{transform:rotate(180deg)}
#botTiles{flex:1;display:flex;gap:3px;justify-content:center;flex-wrap:wrap;min-height:34px}
.back{width:18px;height:32px;border-radius:4px;background:#2a1d14;border:1px solid var(--brass)}
#board{flex:1;overflow:auto;display:flex;min-height:0}
#chain{display:flex;align-items:center;margin:auto;padding:12px}
#msgBox{flex:1}
#msg{font-size:15px;min-height:22px;padding:2px 0}
#ctl{display:flex;gap:6px;flex-wrap:wrap}
#ctl button{padding:6px 10px}
#hand{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 12px;background:#2a1d14;justify-content:safe center}
.tile{--s:28px;display:flex;background:var(--ivory);border-radius:calc(var(--s)*.2);border:1px solid #9d9580;box-shadow:0 2px 3px #0008;flex:none;margin:1px}
.tile.v{flex-direction:column}
.half{width:var(--s);height:var(--s);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--s)*.14);place-items:center}
.tile .half:first-child{border-right:1px solid #b8b09a}
.tile.v .half:first-child{border-right:0;border-bottom:1px solid #b8b09a}
.pip{width:calc(var(--s)*.2);height:calc(var(--s)*.2);border-radius:50%;background:var(--ink)}
.tile.big{--s:38px}
.tile.big.ok{outline:3px solid var(--brass);transform:translateY(-6px)}
.tile.big:not(.ok){opacity:.55}
.tile.sm{--s:24px}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#ov>div{background:var(--wood);border:2px solid var(--brass);border-radius:14px;padding:22px;text-align:center;width:100%;max-width:320px}
#ov p{white-space:pre-line;line-height:1.4}
#ov button{display:block;width:100%;margin:8px 0}
.scr{position:fixed;inset:0;background:var(--wood);display:none;flex-direction:column;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;overflow:auto;z-index:10}

.top,.row{display:flex;align-items:center;gap:8px}
.row span{min-width:70px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;opacity:.5}
.tabs button.on{opacity:1}
#list{flex:1;display:flex;flex-direction:column;gap:6px;overflow:auto}
.rm{text-align:left;background:#5a4330;color:var(--txt);font-weight:normal}
.scr>button{width:100%}
#rdy{z-index:6;align-items:center;justify-content:center;text-align:center}
.bigb{width:150px!important;height:150px;border-radius:50%;font-size:46px;line-height:1.1}
.bigb span{font-size:30px}
#shGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#5a4330;border-radius:12px;padding:10px;text-align:center}
.card .av{background:#7a5233;border-radius:8px;padding:6px}
.card svg{width:100%;max-width:120px;display:block;margin:0 auto}
.card small{display:block;opacity:.8;margin:2px 0 6px}
.card button{width:100%}

#cl b{color:var(--brass)}
#cr{display:flex;gap:6px;margin-top:6px}
#cm{flex:1;background:var(--ivory)}
</style>

 b1:{n:"Ali",g:0,s:"#3b6fb6",h:"#5a3a1e",k:"#e0b48f"},

function click(){
 if(S.snd<=0)return;
 try{const c=ac(),n=c.sampleRate*.06|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const s=c.createBufferSource();s.buffer=b;
 const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=1600;
 const g=c.createGain();g.gain.value=S.snd;
 s.connect(f);f.connect(g);g.connect(c.destination);s.start()}catch(e){}
}
const NT=[220,261.6,293.7,329.6,392,440,523.3];
function note(){
 if(S.mus<=0||!AC)return;
 const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;
 o.type="sine";o.frequency.value=NT[Math.random()*NT.length|0]/(Math.random()<.3?2:1);
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.5,t0+1);g.gain.exponentialRampToValueAtTime(.001,t0+4.5);
 o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+5);
}

const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
function half(n){const h=document.createElement("div");h.className="half";

function tileEl(a,b,cls){const e=document.createElement("div");e.className="tile "+(a===b?"v ":"")+cls;e.append(half(a),half(b));return e}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const pip=h=>h.reduce((s,x)=>s+x[0]+x[1],0);
const ends=()=>G.chain.length?[G.chain[0][0],G.chain[G.chain.length-1][1]]:[null,null];
function sides(tl){
 if(!G.chain.length)return["R"];
 const [l,r]=ends(),s=[];

const legal=h=>h.map((x,i)=>sides(x).length?i:-1).filter(i=>i>=0);

// free=true: udan tərəf istədiyi daşla başlayır
function deal(free){
 const all=[];for(let i=0;i<7;i++)for(let j=i;j<7;j++)all.push([i,j]);
 shuffle(all);
 const A=all.splice(0,7),B=all.splice(0,7);
 if(free)return {A,B,yard:all,chain:[],first:null};
 let best=null,first=null;
 const score=x=>(x[0]===x[1]?100:0)+x[0]+x[1];
 for(const [n,h] of [["A",A],["B",B]])for(const x of h)if(!best||score(x)>score(best)){best=x;first=n}
 const h=first==="A"?A:B;h.splice(h.indexOf(best),1);
 return {A,B,yard:all,chain:[[best[0],best[1]]],first};
}

}

 else if(side==="L"){const l=G.chain[0][0];if(b!==l)[a,b]=[b,a];G.chain.unshift([a,b])}
 else{const r=G.chain[G.chain.length-1][1];if(a!==r)[a,b]=[b,a];G.chain.push([a,b])}
 G.passes=0;click();
}
function afterMove(who){
 const h=who==="p"?G.hand:G.bot;
 if(h.length===0)return endRound(who,false);
 G.turn=who==="p"?"b":"p";G.pending=null;G.tt=now();
 render();
 if(online)sync();else if(G.turn==="b")botMove();
}
function doPass(who){
 G.passes++;
 if(G.passes>=2)return endRound(null,true);
 G.turn=who==="p"?"b":"p";G.tt=now();render(who==="b"?t("bp"):"");
 if(online)sync();else if(G.turn==="b")botMove();
}
function playerTile(i){
 if(!G||G.turn!=="p"||G.over)return;
 const s=sides(G.hand[i]);if(!s.length)return;
 const [l,r]=ends();
 if(s.length===1||l===r){place(G.hand,i,s[0]);return afterMove("p")}
 G.pending=i;render(t("choose"));
}
$("L").onclick=()=>{if(G.pending!=null){place(G.hand,G.pending,"L");afterMove("p")}};
$("R").onclick=()=>{if(G.pending!=null){place(G.hand,G.pending,"R");afterMove("p")}};
$("draw").onclick=()=>{if(G.turn==="p"&&!G.over&&!legal(G.hand).length&&G.yard.length){G.hand.push(G.yard.pop());G.tt=now();render();if(online)sync()}};
$("pass").onclick=()=>{if(G.turn==="p"&&!G.over&&!legal(G.hand).length&&!G.yard.length)doPass("p")};

function botMove(){
 setTimeout(()=>{
  if(online||!G||G.over||G.turn!=="b")return;
  const mv=legal(G.bot);
  if(!mv.length){
   if(G.yard.length){G.bot.push(G.yard.pop());render(t("bd"));return botMove()}
   return doPass("b");
  }
  const w=x=>(x[0]===x[1]?20:0)+x[0]+x[1];
  let pick;
  if(!G.chain.length)pick=mv.sort((a,b)=>w(G.bot[b])-w(G.bot[a]))[0];
  else if(level==="easy")pick=mv[Math.floor(Math.random()*mv.length)];
  else if(level==="normal")pick=mv.sort((a,b)=>G.bot[b][0]+G.bot[b][1]-G.bot[a][0]-G.bot[a][1])[0];
  else{
   let bs=-1;for(const i of mv){const x=G.bot[i];
    for(const sd of sides(x)){
     const [l,r]=ends();const open=sd==="L"?(x[0]===l?x[1]:x[0]):(x[0]===r?x[1]:x[0]);
     const rest=G.bot.filter((_,k)=>k!==i);
     const sc=x[0]+x[1]+3*rest.filter(y=>y[0]===open||y[1]===open).length+(x[0]===x[1]?4:0);
     if(sc>bs){bs=sc;pick=i}}}
  }
  const x=G.bot[pick],sd=sides(x);
  let side=sd[0];
  if(sd.length>1&&level==="hard"){
   const [l,r]=ends();const cnt=v=>G.bot.filter((y,k)=>k!==pick&&(y[0]===v||y[1]===v)).length;
   const oL=x[0]===l?x[1]:x[0],oR=x[0]===r?x[1]:x[0];side=cnt(oL)>=cnt(oR)?"L":"R"}
  place(G.bot,pick,side);afterMove("b");
 },700);
}

// ---------- taymer ----------
function timeoutPass(){
 G.pending=null;G.turn="b";G.tt=now();
 render(t("timeUp"));
 if(online)sync();else botMove();
}
function enforce(seen){
 online.ref.child("s").transaction(c=>{
  if(!c||c.over||c.tt!==seen)return;
  c.turn=c.turn==="h"?"g":"h";c.tt=now();return c;
 });
}
function tick(){
 if(online&&online.room&&!online.room.s&&online.room.guest&&online.room.rd){
  const l=online.room.rd-now();
  $("rC").textContent=Math.max(0,Math.ceil(l/1000));
  if(online.role==="h"&&l<-400&&online.kicked!==online.room.rd){online.kicked=online.room.rd;enforceReady()}
 }
 const f=$("tfill");
 if(!G||G.over||!G.tt||(!online&&G.turn==="b")){$("tm").textContent="";f.style.width="0";return}
 const left=TURN_MS-(now()-G.tt);
 $("tm").textContent="⏱ "+Math.max(0,Math.ceil(left/1000));
 f.style.width=Math.max(0,Math.min(100,left/TURN_MS*100))+"%";
 f.className=(left<4000&&G.turn==="p")?"warn":"";
 if(left<=0&&fired!==G.tt){
  if(G.turn==="p"){fired=G.tt;timeoutPass()}
  else if(online&&left<-GRACE){fired=G.tt;enforce(G.tt)}
 }
}
setInterval(tick,250);

// ---------- raund sonu ----------
function endRound(winner,blocked){
 G.over=true;let gain=0;
 const pp=pip(G.hand),bp=pip(G.bot);
 if(!blocked)gain=winner==="p"?bp:pp;
 else{winner=pp<bp?"p":bp<pp?"b":null;gain=Math.abs(pp-bp)}
 if(winner)G.scores[winner]+=gain;
 G.res={w:winner,gain,bl:blocked,fin:G.scores.p>=TARGET||G.scores.b>=TARGET,sur:null};
 render();
 if(online)sync();else setTimeout(showResult,600);
}
function showResult(){
 if(!G||!G.res)return;
 const r=G.res,fin=r.fin;
 let title;
 if(r.sur)title=r.sur==="p"?t("surMe"):t("surOpp");
 else title=fin?(G.scores.p>=G.scores.b?t("mW"):t("mL")):(r.w==="p"?t("rW"):r.w==="b"?t("rL"):t("rD"));
 $("ovT").textContent=title;
 let p=(r.bl?t("blocked")+" ":"")+(!r.sur&&r.w&&r.gain?nm(r.w)+" +"+r.gain+" "+t("pts"):"")+"\n"+G.scores.p+" : "+G.scores.b;
 const b=$("ovB");
 if(r.sur)b.style.display="none";
 else{
  b.style.display="";
  if(!online){b.disabled=false;b.textContent=t("again");b.onclick=()=>{$("ov").style.display="none";nextBot(fin)}}
  else{
   const me=online.role,op=me==="h"?"g":"h",rm=(online.room&&online.room.rm)||{};
   const mine=!!rm[me],theirs=!!rm[op];
   b.disabled=mine;
   b.textContent=mine?t("rmWait"):theirs?t("rmAcc"):t("again");
   if(theirs&&!mine)p+="\n"+t("rmAsk");
   if(online.oppOn===false)p+="\n"+t("oppOff");
   b.onclick=()=>rematchClick(fin);
  }
 }
 $("ovP").textContent=p;
 $("ovL").textContent=t("toLobby");$("ovL").onclick=()=>toLobby();
 $("ov").style.display="flex";
}
function rematchClick(fin){
 if(!online)return;click();
 const me=online.role;
 online.ref.child("rm").transaction(c=>{c=c||{};c[me]=true;return c},(err,ok,snap)=>{
  const v=snap&&snap.val();
  if(ok&&v&&v.h&&v.g)startOnline(fin);
 },false);
}

// ---------- təslim ----------
function surrender(){
 if(!G||G.over)return;
 if(!confirm(t("surQ")))return;
 G.over=true;G.pending=null;
 G.res={w:"b",gain:0,bl:false,fin:true,sur:"p"};
 render();
 if(online){Promise.resolve(sync()).finally(()=>toLobby())}else toLobby();
}
$("flag").onclick=surrender;

// ================= ONLAYN =================
function toDB(){
 const me=online.role,op=me==="h"?"g":"h";
 const toR=x=>x==="p"?me:x==="b"?op:null;
 const r=G.res?{w:toR(G.res.w),gain:G.res.gain||0,bl:!!G.res.bl,fin:!!G.res.fin,sur:toR(G.res.sur)}:null;
 return {["hand_"+me]:G.hand,["hand_"+op]:G.bot,yard:G.yard,chain:G.chain,turn:G.turn==="p"?me:op,
  passes:G.passes||0,["sc_"+me]:G.scores.p,["sc_"+op]:G.scores.b,over:!!G.over,round:G.round||0,tt:G.tt||now(),res:r};
}
function fromDB(s){
 const me=online.role,op=me==="h"?"g":"h";
 const fromR=x=>x===me?"p":x?"b":null;
 let res=null;
 if(s.res)res={w:fromR(s.res.w),gain:s.res.gain||0,bl:!!s.res.bl,fin:!!s.res.fin,sur:fromR(s.res.sur)};
 G={hand:s["hand_"+me]||[],bot:s["hand_"+op]||[],yard:s.yard||[],chain:s.chain||[],turn:s.turn===me?"p":"b",
  passes:s.passes||0,scores:{p:s["sc_"+me]||0,b:s["sc_"+op]||0},over:!!s.over,round:s.round||0,tt:s.tt||now(),res,pending:null};
}
function sync(){return online.ref.child("s").set(toDB()).catch(e=>setLb(t("err")+" "+(e.code||e.message)))}
function startOnline(reset){
 if(online.starting)return;online.starting=true;
 const prev=(online.room&&online.room.s)||{},w=prev.res&&prev.res.w;
 const free=!!w,d=deal(free);
 const s={hand_h:d.A,hand_g:d.B,yard:d.yard,chain:d.chain,turn:free?w:(d.first==="A"?"g":"h"),passes:0,
  sc_h:reset?0:(prev.sc_h||0),sc_g:reset?0:(prev.sc_g||0),over:false,round:(prev.round||0)+1,tt:now(),res:null};
 online.ref.update({s,rm:null,rd:null,rdy_h:null,rdy_g:null}).then(()=>{online.starting=false}).catch(e=>{online.starting=false;setLb(t("err")+" "+(e.code||e.message))});
}
function enforceReady(){
 const r=online.room;
 if(r.rdy_g)online.ref.update({rd:now()+5000,rdy_h:null,rdy_g:null});
 else{online.ref.update({guest:null,rd:null,rdy_h:null,rdy_g:null,p_g:null,sk_g:null});online.lb.update({n:1})}
}
function showReady(r){
 const me=online.role;$("rdy").style.display="flex";
 if(!r.guest){
  $("rT").textContent=t("waitOpp");
  $("rP").textContent=online.pin?t("pin")+": "+online.pin:"";
  $("rB").style.display="none";return;
 }
 if(me==="h"&&!r.rd)online.ref.update({rd:now()+5000,rdy_h:null,rdy_g:null});
 const mine=!!r["rdy_"+me];
 $("rT").textContent=t("readyQ");$("rB").style.display="";$("rB").disabled=mine;
 $("rP").textContent=mine?t("readyWait"):"";
 if(r.rdy_h&&r.rdy_g&&me==="h")startOnline(true);
}
$("rB").onclick=()=>{if(online){click();online.ref.child("rdy_"+online.role).set(true)}};
$("rL").onclick=()=>toLobby();

function onRoom(r){
 if(!online)return;
 if(r===null)return toLobby(t("closed"));
 online.room=r;
 const me=online.role,op=me==="h"?"g":"h";
 online.oppOn=r["p_"+op]!==false;
 if(me==="g"&&r.guest!==online.uid)return toLobby(t("kicked"));
 if(!r.s){showReady(r);return}
 $("rdy").style.display="none";
 const pl=G?G.chain.length:0;
 fromDB(r.s);
 if(pl>0&&G.chain.length>pl)click();
 render();
 if(G.over&&G.res)showResult();
 else $("ov").style.display="none";
}
async function login(){
 if(typeof firebase==="undefined")throw new Error("Firebase yüklənmədi (internet?)");
 if(!fbInit){
  firebase.initializeApp(CFG);fbInit=true;
  firebase.database().ref(".info/serverTimeOffset").on("value",s=>{off=s.val()||0});
 }
 const a=firebase.auth();
 return a.currentUser?a.currentUser.uid:(await a.signInAnonymously()).user.uid;
}
function attach(id,role,uid,pin){
 const db=firebase.database(),ref=db.ref("rooms/"+id);
 online={id,role,uid,pin,ref,pr:ref.child("p_"+role),lb:db.ref("lobby/"+id),conn:db.ref(".info/connected"),chat:ref.child("chat"),room:null,starting:false,oppOn:true,kicked:0};
 online.conn.on("value",s=>{if(s.val()&&online){online.pr.onDisconnect().set(false);online.pr.set(true)}});
 ref.child("sk_"+role).set(mySkin);
 ref.on("value",s=>onRoom(s.val()),e=>toLobby(t("err")+" "+(e.code||e.message)));
 online.chat.limitToLast(30).on("value",s=>renderChat(s.val()));
 G=null;fired=0;
 hideScr();$("chatB").style.display="";labels();render();
}
function leave(){
 if(online){
  const o=online;online=null;
  try{
   o.conn.off();o.ref.off();o.chat.off();
   o.pr.onDisconnect().cancel();
   const started=!!(o.room&&o.room.s);
   if(o.role==="h"){o.lb.onDisconnect().cancel();o.lb.remove();if(!started)o.ref.remove();else o.pr.set(false)}
   else if(!started){o.ref.update({guest:null,rd:null,rdy_h:null,rdy_g:null,p_g:null,sk_g:null});o.lb.update({n:1})}
   else o.pr.set(false);
  }catch(e){}
 }
 G=null;
 $("rdy").style.display="none";$("ov").style.display="none";$("chat").style.display="none";
 $("chatB").style.display="none";
}

// ---------- çat ----------
function renderChat(v){
 const L=$("cl");L.innerHTML="";
 Object.values(v||{}).forEach(x=>{
  const d=document.createElement("div"),b=document.createElement("b");
  b.textContent=(online&&x.r===online.role?t("you"):t("opp"))+": ";
  d.append(b,document.createTextNode(String(x.m||"")));L.appendChild(d);
 });
 L.scrollTop=L.scrollHeight;
}
function sendChat(){
 const m=$("cm").value.trim().slice(0,100);
 if(!m||!online)return;
 online.chat.push({r:online.role,m});$("cm").value="";
}
$("cs").onclick=sendChat;
$("cm").onkeydown=e=>{if(e.key==="Enter")sendChat()};
$("chatB").onclick=()=>{const c=$("chat");c.style.display=c.style.display==="flex"?"none":"flex"};

// ================= LOBİ =================
function hideScr(){document.querySelectorAll(".scr").forEach(e=>{if(e.id!=="rdy")e.style.display="none"})}
function setLb(x){$("lSt").textContent=x}
async function showLobby(){
 try{
  await login();
  if(!lobbyOn){lobbyOn=true;firebase.database().ref("lobby").on("value",s=>{lobbyData=s.val()||{};renderList()},e=>setLb(t("err")+" "+(e.code||e.message)))}
 }catch(e){setLb(t("err")+" "+(e.code||e.message))}
}
function toLobby(msg){
 leave();hideScr();
 $("lobby").style.display="flex";setLb(msg||"");renderList();showLobby();
}
function renderList(){
 const L=$("list");L.innerHTML="";
 $("tG").className=tab==="g"?"on":"";$("tP").className=tab==="p"?"on":"";
 const ids=Object.keys(lobbyData).filter(k=>!!lobbyData[k].pr===(tab==="p")).sort((a,b)=>lobbyData[b].t-lobbyData[a].t);
 if(!ids.length){L.textContent=t("none");return}
 for(const id of ids){
  const r=lobbyData[id],b=document.createElement("button");b.className="rm";
  b.textContent=(r.pr?"🔒":"🌐")+"  "+r.c+"  ·  "+r.m+"  ·  "+r.u+"  ·  "+r.n+"/"+r.x;
  b.disabled=r.n>=r.x;b.onclick=()=>joinRoom(id,r.pr);L.appendChild(b);
 }
}
$("tG").onclick=()=>{tab="g";renderList()};
$("tP").onclick=()=>{tab="p";renderList()};
async function createRoom(){
 try{
  let pin=null;
  if(tab==="p"){pin=prompt(t("pinAsk"));if(pin===null)return;if(!/^\d{4}$/.test(pin))return setLb(t("pinBad"))}
  setLb(t("wait"));
  const uid=await login(),db=firebase.database();
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let id="";
  for(const n of crypto.getRandomValues(new Uint8Array(8)))id+=A[n%A.length];
  const room={host:uid,t:Date.now()};if(pin)room.pin=pin;
  await db.ref("rooms/"+id).set(room);
  const lb=db.ref("lobby/"+id);
  await lb.set({m:"1v1",c:CC,u:"P"+uid.slice(0,4),n:1,x:2,pr:!!pin,t:Date.now()});
  lb.onDisconnect().remove();
  attach(id,"h",uid,pin);
 }catch(e){setLb(t("err")+" "+(e.code||e.message))}
}
async function joinRoom(id,pr){
 try{
  let pin=null;
  if(pr){pin=prompt(t("pinAsk"));if(pin===null)return}
  setLb(t("wait"));
  const uid=await login(),db=firebase.database(),ref=db.ref("rooms/"+id);
  const r=(await ref.once("value")).val();
  if(!r)return setLb(t("nf"));
  if(r.pin&&r.pin!==pin)return setLb(t("pinWrong"));
  let role;
  if(r.host===uid)role="h";
  else if(r.guest===uid)role="g";
  else if(!r.guest){await ref.child("guest").set(uid);role="g";db.ref("lobby/"+id).update({n:2})}
  else return setLb(t("full"));
  attach(id,role,uid,r.pin||null);
 }catch(e){setLb(t("err")+" "+(e.code||e.message))}
}
$("lNew").onclick=createRoom;
$("lBot").onclick=()=>{leave();hideScr();labels();newMatch()};

 const g=$("shGrid");g.innerHTML="";
 for(const k in SK){

 }

$("shBack").onclick=()=>{$("shopScr").style.display="none";$("lobby").style.display="flex"};

// ---------- menyu / ayarlar ----------
$("menuB").onclick=()=>{
 $("mSur").style.display=(G&&!G.over)?"":"none";
 $("menuScr").style.display="flex";
};
$("mRes").onclick=()=>hideScr();
$("mSur").onclick=()=>{hideScr();surrender()};

$("sBack").onclick=()=>{$("setScr").style.display="none";$(setFrom).style.display="flex"};

$("lvl").onchange=e=>{level=e.target.value;localStorage.setItem("dlvl",level)};

// ================= ÇƏKMƏ =================
function render(msg){
 // personajlar
 const op=online?(online.role==="h"?"g":"h"):null;
 const osk=online?((online.room&&online.room["sk_"+op])||"b2"):botSk;
 const oa=$("oppAv");if(oa.dataset.k!==osk){oa.dataset.k=osk;oa.innerHTML=charSVG(osk)}
 const ma=$("meAv");if(ma.dataset.k!==mySkin){ma.dataset.k=mySkin;ma.innerHTML=charSVG(mySkin)}
 if(!G)return;
 $("sYou").textContent=G.scores.p;$("sBot").textContent=G.scores.b;
 $("yard").textContent=t("yard")+": "+G.yard.length;
 const bt=$("botTiles");bt.innerHTML="";G.bot.forEach(()=>{const d=document.createElement("div");d.className="back";bt.appendChild(d)});
 const ch=$("chain");ch.innerHTML="";G.chain.forEach(x=>ch.appendChild(tileEl(x[0],x[1],"sm")));
 const bd=$("board");bd.scrollLeft=(bd.scrollWidth-bd.clientWidth)/2;
 const lg=G.turn==="p"&&!G.over?legal(G.hand):[];
 const hd=$("hand");hd.innerHTML="";
 G.hand.forEach((x,i)=>{const e=tileEl(x[0],x[1],"big"+(lg.includes(i)?" ok":""));e.onclick=()=>playerTile(i);hd.appendChild(e)});
 const myTurn=G.turn==="p"&&!G.over,none=myTurn&&!lg.length;
 $("draw").disabled=!(none&&G.yard.length);
 $("pass").disabled=!(none&&!G.yard.length);
 const ch2=G.pending!=null;
 $("L").style.display=$("R").style.display=ch2?"":"none";
 $("draw").style.display=$("pass").style.display=ch2?"none":"";
 $("flag").disabled=G.over;
 const st=$("oppSt"),offl=!!online&&online.oppOn===false;
 if(online){st.textContent=offl?"🔴":"🟢";st.className=offl?"off":""}
 else{st.textContent="";st.className=""}
 let m=msg;
 if(!m)m=G.over?"":!myTurn?(online?t("ot"):t("bt")):none?(G.yard.length?t("noMove"):t("mustPass")):t("yt");
 if(offl&&!G.over)m+=" · "+t("oppOff");
 $("msg").textContent=m;
}
function labels(){
 const T={lbBot:bn(),lbYou:t("you"),draw:t("draw"),pass:t("pass"),L:t("left"),R:t("right"),
  lT:t("lobby"),tG:t("glob"),tP:t("priv"),lNew:t("create"),lBot:t("bot"),
  mT:t("menu"),mRes:t("resume"),mSet:t("sett"),mSur:t("sur"),mLob:t("toLobby"),
  sT:t("sett"),sL:t("lang"),sLv:t("level"),sS:t("snd"),sM:t("mus"),sBack:t("back"),
  shT:t("shop"),shBack:t("back"),rL:t("toLobby"),cs:t("send")};
 for(const k in T)$(k).textContent=T[k];
 $("cm").placeholder=t("chatPh");
 const s=$("lvl");s.innerHTML="";
 for(const k of ["easy","normal","hard"]){const o=document.createElement("option");o.value=k;o.textContent=t(k);if(k===level)o.selected=true;s.appendChild(o)}
 document.documentElement.lang=lang;syncSet();
}
labels();
$("chatB").style.display="none";
toLobby();
